[project]
name = "feed-cleaner"
version = "0.1.0"
description = "CLI do czyszczenia feedu produktowego"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[project.scripts]
feed-cleaner = "feed_cleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feed_cleaner"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
extend-exclude = ["scripts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
